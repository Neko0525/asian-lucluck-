<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Personal Page</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  overflow-x: hidden;
}

body {
  font-family: 'Inter', sans-serif;
  background: radial-gradient(circle at top, #111 0%, #000 70%);
  color: #fff;
  display: flex;
  justify-content: center;
}

/* CONTAINER */
.container {
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding: 28px 20px;
  text-align: center;
}

/* LOGO */
.logo {
  font-size: 32px;
  margin-bottom: 20px;
  opacity: 0.85;
}

/* HERO */
h1 {
  font-size: 34px;
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin-bottom: 26px;
}

.fade {
  color: #666;
}

/* SOCIALS */
.socials {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 30px;
}

.social {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: #fff;
  background: rgba(255,255,255,0.05);
  padding: 12px;
  border-radius: 999px;
  font-size: 14px;
  border: 1px solid rgba(255,255,255,0.06);
}

.social:hover {
  background: rgba(255,255,255,0.1);
}

/* ICON */
.icon {
  width: 18px;
  height: 18px;
  fill: white;
  opacity: 0.9;
}

/* CARDS */
.cards {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.card {
  display: flex;
  justify-content: space-between;
  align-items: center;
  text-decoration: none;
  color: #fff;
  background: rgba(255,255,255,0.05);
  border-radius: 18px;
  padding: 18px;
  border: 1px solid rgba(255,255,255,0.06);
}

.card:hover {
  background: rgba(255,255,255,0.08);
  transform: translateY(-2px);
}

.card-left {
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
}

.card h3 {
  font-size: 16px;
  font-weight: 600;
}

.card p {
  font-size: 13px;
  color: #aaa;
}

.arrow {
  font-size: 18px;
  opacity: 0.6;
}

/* FOOTER */
.footer {
  margin-top: 30px;
  font-size: 12px;
  color: #555;
}
</style>
</head>
